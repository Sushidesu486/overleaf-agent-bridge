name: overleaf-agent-lab
services:
  mongo:
    image: public.ecr.aws/docker/library/mongo@sha256:1d7a2d487c6465ea022474b90b65d6c91bb600b421b65880d8c6e141d6122200
    command: ["--replSet", "overleaf", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: public.ecr.aws/docker/library/mongo@sha256:1d7a2d487c6465ea022474b90b65d6c91bb600b421b65880d8c6e141d6122200
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint: ["mongosh", "--host", "mongo", "--quiet", "--eval"]
    command:
      - 'try { rs.status() } catch(e) { if (e.codeName !== "NotYetInitialized") throw e; rs.initiate({_id:"overleaf",members:[{_id:0,host:"mongo:27017"}]}) }; for(let i=0;i<60;i++){if(db.hello().isWritablePrimary) quit(0);sleep(1000)}; quit(1)'
    mem_limit: 512m
    cpus: 1
  redis:
    image: docker.io/library/redis@sha256:a7aad82554197a54c653388bfded882a59d6b4a02468484bc31bae6772dcc42c
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  overleaf:
    build: .
    image: overleaf-agent-lab:6.3.2-dev
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:18080:80"]
    volumes: ["overleaf-data:/var/lib/overleaf"]
    mem_limit: 6g
    cpus: 4
    stop_grace_period: 90s
    environment:
      OVERLEAF_APP_NAME: Overleaf Agent Lab
      OVERLEAF_SITE_URL: http://localhost:18080
      OVERLEAF_HEADER_EXTRAS: '[{"text":"我的 Agent","url":"/user/agent","class":"subdued"}]'
      OVERLEAF_MONGO_URL: mongodb://mongo:27017/sharelatex?replicaSet=overleaf
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      OVERLEAF_SESSION_SECRET: ${OVERLEAF_SESSION_SECRET:?required}
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:?required}
      OVERLEAF_EMAIL_FROM_ADDRESS: noreply@example.invalid
      EMAIL_CONFIRMATION_DISABLED: "true"
      ENABLED_LINKED_FILE_TYPES: project_file,project_output_file
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/login"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
volumes:
  mongo-data:
  redis-data:
  overleaf-data:
